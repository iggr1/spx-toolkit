<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SPX Toolkit</title>
  <style>
    :root { --orange: #ff6000; }
    body{margin:0;width:340px;font-family:Inter,Arial,sans-serif;background:#0f172a;color:#e5e7eb}
    .box{padding:16px}
    h1{font-size:16px;margin:0 0 6px;font-weight:900}
    p{font-size:12px;line-height:1.45;color:#94a3b8;margin:0 0 14px}
    button{width:100%;border:0;border-radius:14px;background:linear-gradient(135deg,#ff6000,#fb923c);color:white;font-weight:900;padding:12px;cursor:pointer}
    .switch-area{margin-top:14px;padding-top:12px;border-top:1px solid rgba(148,163,184,.18);display:flex;flex-direction:column;gap:10px}
    .switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:10px 11px}
    .switch-text{display:flex;flex-direction:column;gap:2px;min-width:0}
    .switch-title{font-size:12px;font-weight:900;color:#f8fafc}
    .switch-desc{font-size:10px;color:#94a3b8;line-height:1.25}
    .switch{position:relative;display:inline-block;width:46px;height:26px;flex:0 0 auto}
    .switch input{opacity:0;width:0;height:0}
    .slider{position:absolute;cursor:pointer;inset:0;background:#334155;border-radius:999px;transition:.18s;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
    .slider:before{content:"";position:absolute;height:20px;width:20px;left:3px;top:3px;background:white;border-radius:50%;transition:.18s;box-shadow:0 2px 8px rgba(0,0,0,.28)}
    .switch input:checked + .slider{background:var(--orange)}
    .switch input:checked + .slider:before{transform:translateX(20px)}
    .warn{margin-top:10px;font-size:11px;color:#fbbf24}
    .saved{margin-top:8px;font-size:10px;color:#86efac;min-height:13px}
  </style>
</head>
<body>
  <div class="box">
    <h1>SPX Toolkit</h1>
    <p>Abre painel fixo para executar funções e relatórios na aba SPX logada.</p>
    <button id="openPanel">Abrir painel</button>

    <div class="switch-area">
      <div class="switch-row">
        <div class="switch-text">
          <div class="switch-title">Histórico de entrega</div>
          <div class="switch-desc">Modal de tentativas no recebimento.</div>
        </div>
        <label class="switch" title="Ligar/desligar histórico de entrega">
          <input id="deliveryHistorySwitch" type="checkbox">
          <span class="slider"></span>
        </label>
      </div>

      <div class="switch-row">
        <div class="switch-text">
          <div class="switch-title">Atalhos EHA</div>
          <div class="switch-desc">Box de atalhos e teclas da tela EHA.</div>
        </div>
        <label class="switch" title="Ligar/desligar atalhos EHA">
          <input id="ehaShortcutsSwitch" type="checkbox">
          <span class="slider"></span>
        </label>
      </div>

      <div class="switch-row">
        <div class="switch-text">
          <div class="switch-title">Desativar Auto Add</div>
          <div class="switch-desc">Alterna a adição automática (AutoAdd)</div>
        </div>
        <label class="switch" title="Desativar Auto Add">
          <input id="autoAddSwitch" type="checkbox">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="saved" id="savedMsg"></div>
    <div class="warn">Roda somente em https://spx.shopee.com.br/</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
